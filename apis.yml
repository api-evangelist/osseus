name: Osseus
description: >-
  Osseus is a secure research intelligence platform - "the secure research brain
  for R&D" - that connects the tools teams already use, scattered documents, and
  the knowledge in people's heads into one permissioned research brain.
  Permission-aware AI agents surface relevant evidence, experts, and next
  actions; proactive watchers flag integration issues and repeated work before
  costly mistakes; and background automations run across connected systems. The
  company also exposes a memory API for connecting internal agents to a governed
  evidence layer. Osseus (Y Combinator S2026) was founded by Anish Mariathasan
  and Ayush Patel and serves R&D teams across aerospace, automotive, robotics,
  electronics, pharma, and biotech.
